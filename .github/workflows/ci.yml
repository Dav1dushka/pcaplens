name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: End to end with the installed command
        run: |
          pcaplens demo demo.pcapng
          pcaplens demo.pcapng --html report.html --json report.json
          pcaplens demo.pcapng --fail-on high && exit 1 || test $? -eq 3
